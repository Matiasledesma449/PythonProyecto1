{% extends "base.html" %}

{% block title %}Confirmar eliminación{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="card shadow-sm">
        <div class="card-body">
            <h1 class="h4 text-danger">Confirmar eliminación</h1>

            <p>
                ¿Estás seguro de que querés eliminar esta reparación?
            </p>

            <p>
                <strong>Reparación:</strong> {{ reparacion }}
            </p>

            <form method="post">
                {% csrf_token %}

                <button type="submit" class="btn btn-danger">
                    Sí, eliminar
                </button>

                <a href="{% url 'myapp:reparaciones' %}" class="btn btn-secondary">
                    Cancelar
                </a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
